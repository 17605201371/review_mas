<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Non-destructive recovery</title>
  <desc id="desc">A supported claim remains supported while a verified review issue creates a supported-but-contested relation. Unsafe downgrade attempts are tracked separately.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .support { fill: #eef7f2; stroke: #3f7f45; stroke-width: 1.8; rx: 12; }
      .issue { fill: #eef4ff; stroke: #315f9c; stroke-width: 2.2; rx: 12; }
      .blocked { fill: #fff3f0; stroke: #a64b3c; stroke-width: 1.8; rx: 12; }
      .view { fill: #ffffff; stroke: #475569; stroke-width: 1.8; rx: 12; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #a64b3c; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #475569; text-anchor: middle; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .metric { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #315f9c; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="500"/>
  <text class="title" x="550" y="34">Recovery As Non-Destructive State Repair</text>
  <text class="subtitle" x="550" y="58">Verified issues expose supported-but-contested claims without overwriting real positive support.</text>

  <rect class="support" x="58" y="134" width="210" height="78"/>
  <text class="label" x="163" y="161"><tspan x="163" dy="0">Real positive</tspan><tspan x="163" dy="23">support</tspan></text>

  <rect class="support" x="330" y="134" width="210" height="78"/>
  <text class="label" x="435" y="161"><tspan x="435" dy="0">Supported</tspan><tspan x="435" dy="23">claim</tspan></text>

  <rect class="issue" x="330" y="276" width="210" height="86"/>
  <text class="label" x="435" y="302"><tspan x="435" dy="0">Verified review</tspan><tspan x="435" dy="23">issue bundle</tspan></text>

  <rect class="issue" x="610" y="192" width="184" height="92"/>
  <text class="label" x="702" y="222"><tspan x="702" dy="0">mark_contested</tspan><tspan x="702" dy="24">relation</tspan></text>

  <rect class="issue" x="854" y="174" width="200" height="128"/>
  <text class="label" x="954" y="211"><tspan x="954" dy="0">Supported-but-</tspan><tspan x="954" dy="24">contested</tspan><tspan x="954" dy="24">claim relation</tspan></text>

  <rect class="view" x="338" y="416" width="424" height="54"/>
  <text class="label" x="550" y="442">Final view renders support plus concern</text>

  <rect class="blocked" x="58" y="292" width="210" height="70"/>
  <text class="small" x="163" y="309"><tspan x="163" dy="0">Unsafe downgrade</tspan><tspan x="163" dy="20">attempts blocked</tspan><tspan x="163" dy="20">and tracked separately</tspan></text>

  <path class="arrow" d="M268 173 H330"/>
  <path class="arrow" d="M540 173 C590 173 590 220 610 220"/>
  <path class="arrow" d="M540 319 C590 319 590 256 610 256"/>
  <path class="arrow" d="M794 238 H854"/>
  <path class="arrow" d="M954 302 C954 396 710 443 762 443"/>
  <text class="metric" x="702" y="326">full20 offline: 14 mark-contested commits</text>
  <text class="metric" x="702" y="348">6 verified-review-issue repairs</text>
  <text class="metric" x="702" y="370">fresh live evidence: partial16 only</text>
</svg>
