<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P34 PaperIndex 离线审核</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; --ink:#17202a; --muted:#66727e; --line:#d8dde3; --paper:#fff; --panel:#f4f6f8; --accent:#176b55; --soft:#dff1eb; }
    body { margin:0; color:var(--ink); background:var(--panel); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,textarea { font:inherit; }
    button { min-height:34px; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink); cursor:pointer; }
    button:focus-visible,input:focus-visible,textarea:focus-visible { outline:2px solid #3d8b76; outline-offset:2px; }
    header { position:sticky; top:0; z-index:4; display:flex; align-items:center; gap:12px; min-height:62px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--paper); }
    h1 { margin:0; font-size:18px; white-space:nowrap; }
    .identity { min-width:0; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .primary { margin-left:auto; padding:0 14px; border-color:var(--accent); background:var(--accent); color:#fff; }
    .layout { display:grid; grid-template-columns:minmax(240px,300px) minmax(0,1fr); min-height:calc(100vh - 62px); }
    aside { min-width:0; border-right:1px solid var(--line); background:var(--paper); }
    .progress,.filters { padding:12px; border-bottom:1px solid var(--line); }
    .bar { height:6px; margin-top:8px; background:#e4e8ec; border-radius:3px; overflow:hidden; }
    .bar span { display:block; width:0; height:100%; background:var(--accent); }
    input[type="search"] { width:100%; height:36px; padding:0 10px; border:1px solid var(--line); border-radius:6px; }
    .filters label { display:block; margin-top:8px; }
    .item-list { max-height:calc(100vh - 174px); overflow:auto; }
    .item { width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 8px; padding:10px 12px; text-align:left; border:0; border-bottom:1px solid #edf0f2; border-radius:0; }
    .item.active { background:var(--soft); }
    .item-id { overflow:hidden; color:var(--muted); text-overflow:ellipsis; white-space:nowrap; }
    .done { color:var(--accent); font-weight:600; }
    main { min-width:0; background:var(--paper); }
    .toolbar { position:sticky; top:62px; z-index:3; display:flex; align-items:center; gap:8px; min-height:50px; padding:8px 18px; border-bottom:1px solid var(--line); background:var(--paper); }
    .toolbar button { width:38px; }
    .state { margin-left:auto; color:var(--muted); }
    article { max-width:1100px; padding:24px clamp(18px,4vw,52px) 72px; }
    h2 { margin:4px 0 20px; font-size:22px; }
    h3 { margin:26px 0 9px; font-size:14px; }
    .eyebrow,.muted { color:var(--muted); }
    .paper-text { max-height:320px; padding:12px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; border:1px solid var(--line); background:#fafbfc; }
    .suggestion { padding:9px 0; border-bottom:1px solid #edf0f2; }
    .suggestion label { display:grid; grid-template-columns:auto minmax(0,1fr); gap:9px; align-items:start; }
    .suggestion-title { font-weight:600; }
    .suggestion-preview { color:var(--muted); overflow-wrap:anywhere; }
    .editors { display:grid; gap:10px; margin-top:10px; }
    .editor { border:1px solid var(--line); padding:10px; }
    .editor-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .remove { width:34px; color:#8f3d28; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
    .grid label { display:grid; gap:4px; color:var(--muted); }
    .grid .wide { grid-column:1/-1; }
    .grid input,.grid textarea,textarea.notes { width:100%; border:1px solid var(--line); border-radius:5px; padding:7px; color:var(--ink); }
    .grid textarea { min-height:70px; resize:vertical; }
    .add { margin-top:9px; padding:0 12px; }
    textarea.notes { min-height:90px; resize:vertical; }
    .complete { display:flex; gap:8px; align-items:flex-start; margin-top:14px; }
    @media (max-width:720px) {
      header { position:static; flex-wrap:wrap; }
      .identity { order:3; flex-basis:100%; }
      .layout { display:block; }
      aside { border-right:0; border-bottom:1px solid var(--line); }
      .item-list { max-height:200px; }
      .toolbar { top:0; }
      article { padding:20px 14px 60px; }
      .grid { grid-template-columns:1fr; }
      .grid .wide { grid-column:auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>PaperIndex 离线审核</h1>
    <div id="identity" class="identity"></div>
    <button id="download" class="primary">导出结果</button>
  </header>
  <div class="layout">
    <aside>
      <section class="progress"><strong id="progress">0 / 0</strong><div class="bar"><span id="bar"></span></div></section>
      <section class="filters"><input id="search" type="search" placeholder="搜索 paper"><label><input id="openOnly" type="checkbox"> 只看未完成</label></section>
      <div id="items" class="item-list"></div>
    </aside>
    <main>
      <div class="toolbar"><button id="previous" aria-label="上一条">‹</button><button id="next" aria-label="下一条">›</button><span id="state" class="state"></span></div>
      <article id="document"></article>
    </main>
  </div>
  <script>
    const bundleBase64 = "__P34_BUNDLE_BASE64__";
    const binary = atob(bundleBase64);
    const bundle = JSON.parse(new TextDecoder().decode(Uint8Array.from(binary, (value) => value.charCodeAt(0))));
    if (bundle.schema_version !== "p34_paper_index_exchange_v1") throw new Error("Unsupported PaperIndex bundle schema");
    const immutable = new Map(bundle.items.map((item) => [item.paper_id, item]));
    const cases = new Map(bundle.cases.map((item) => [item.paper_id, item]));
    if (immutable.size !== bundle.items.length || cases.size !== bundle.cases.length || immutable.size !== cases.size) throw new Error("PaperIndex bundle mismatch");
    const app = { visible:[], index:0, dirty:false };
    const $ = (id) => document.getElementById(id);
    const node = (tag, value, className="") => { const item=document.createElement(tag); if(className)item.className=className; item.textContent=value==null?"":String(value); return item; };
    const done = (paperId) => Boolean(cases.get(paperId)?.human_review_complete);
    const selected = (values, suggestion) => (values||[]).some((item) => Number(item.source_span_start) === Number(suggestion.source_span_start));
    const markDirty = () => { app.dirty=true; $("state").textContent="未导出"; };
    const applyFilters = (preferred="") => {
      const query=$("search").value.trim().toLowerCase();
      app.visible=bundle.items.filter((item) => (!query||item.paper_id.toLowerCase().includes(query)) && (!$("openOnly").checked||!done(item.paper_id)));
      const found=preferred?app.visible.findIndex((item)=>item.paper_id===preferred):-1;
      app.index=found>=0?found:Math.min(app.index,Math.max(0,app.visible.length-1));
      render();
    };
    const render = () => {
      const completed=bundle.items.filter((item)=>done(item.paper_id)).length;
      $("progress").textContent=`${completed} / ${bundle.items.length}`;
      $("bar").style.width=`${bundle.items.length?100*completed/bundle.items.length:0}%`;
      const list=$("items"); list.replaceChildren();
      app.visible.forEach((item,index)=>{
        const button=node("button","",`item${index===app.index?" active":""}`);
        button.append(node("span",item.paper_id),node("span",done(item.paper_id)?"已完成":"待审核",done(item.paper_id)?"done":""),node("span","PaperIndex","item-id"));
        button.onclick=()=>{app.index=index;render();}; list.append(button);
      });
      renderCurrent();
    };
    const schemas = {
      expected_boundaries:[["heading","Heading","text"],["section_type","Section type","text"],["source_span_start","Start","number"]],
      key_anchors:[["query","Query","text","wide"],["text","Exact text","textarea","wide"],["section_types","Section types","text"],["source_span_start","Start","number"],["source_span_end","End","number"]],
      false_boundaries:[["heading","Heading","text"],["section_type","Section type","text"],["source_span_start","Start","number"],["reason","Reason","textarea","wide"]],
    };
    const newItem = (key) => key==="expected_boundaries"?{heading:"",section_type:"other",source_span_start:0}:key==="key_anchors"?{query:"",text:"",section_types:[],source_span_start:0,source_span_end:0}:{heading:"",section_type:"other",source_span_start:0,reason:""};
    const renderEditors = (root, auditCase, key) => {
      const values=auditCase[key]||[]; const list=node("div","","editors");
      values.forEach((value,index)=>{
        const editor=node("section","","editor"); const head=node("div","","editor-head"); head.append(node("strong",`人工项 ${index+1}`));
        const remove=node("button","×","remove"); remove.type="button"; remove.setAttribute("aria-label","删除人工项"); remove.onclick=()=>{auditCase[key]=values.filter((_,i)=>i!==index);markDirty();renderCurrent();}; head.append(remove); editor.append(head);
        const grid=node("div","","grid");
        schemas[key].forEach(([field,labelText,kind,className])=>{
          const label=node("label","",className||""); label.append(node("span",labelText));
          const control=kind==="textarea"?document.createElement("textarea"):document.createElement("input"); if(kind!=="textarea")control.type=kind;
          control.value=field==="section_types"&&Array.isArray(value[field])?value[field].join(", "):(value[field]??"");
          control.oninput=()=>{ if(field==="section_types")value[field]=control.value.split(",").map((part)=>part.trim()).filter(Boolean); else if(kind==="number")value[field]=Number(control.value); else value[field]=control.value; markDirty(); };
          label.append(control); grid.append(label);
        }); editor.append(grid); list.append(editor);
      }); root.append(list);
      const add=node("button","+ 添加人工项","add"); add.onclick=()=>{auditCase[key]=[...values,newItem(key)];markDirty();renderCurrent();}; root.append(add);
    };
    const renderSuggestions = (root, auditCase, item, sourceKey, targetKey, title, falseMode=false) => {
      root.append(node("h3",title));
      (item[sourceKey]||[]).forEach((suggestion)=>{
        const box=node("div","","suggestion"); const label=document.createElement("label"); const checkbox=document.createElement("input"); checkbox.type="checkbox"; checkbox.checked=selected(auditCase[targetKey],suggestion);
        checkbox.onchange=()=>{ const current=(auditCase[targetKey]||[]).filter((value)=>Number(value.source_span_start)!==Number(suggestion.source_span_start)); if(checkbox.checked)current.push({...suggestion}); auditCase[targetKey]=current; markDirty(); renderCurrent(); };
        const content=node("div",""); content.append(node("div",suggestion.heading||suggestion.query||suggestion.text||"未命名建议","suggestion-title"),node("div",suggestion.text_preview||suggestion.text||suggestion.reason||(falseMode?"疑似错误 boundary":""),"suggestion-preview")); label.append(checkbox,content); box.append(label); root.append(box);
      });
      if(!(item[sourceKey]||[]).length)root.append(node("div","没有机器建议。","muted"));
      renderEditors(root,auditCase,targetKey);
    };
    const renderCurrent = () => {
      const root=$("document"); root.replaceChildren(); if(!app.visible.length){root.append(node("div","当前筛选条件下没有论文。","muted"));return;}
      const item=app.visible[app.index]; const auditCase=cases.get(item.paper_id);
      root.append(node("div",`${app.index+1} / ${app.visible.length}`,"eyebrow"),node("h2",item.paper_id),node("h3","论文原文"),node("div",item.paper_text||"无原文","paper-text"));
      renderSuggestions(root,auditCase,item,"machine_boundary_suggestions","expected_boundaries","真实 section boundary");
      renderSuggestions(root,auditCase,item,"machine_anchor_suggestions","key_anchors","关键检索 anchor");
      renderSuggestions(root,auditCase,item,"machine_false_boundary_suggestions","false_boundaries","疑似错误 boundary",true);
      root.append(node("h3","审核记录")); const notes=node("textarea","","notes"); notes.placeholder="审核记录"; notes.value=auditCase.human_review_notes||""; notes.oninput=()=>{auditCase.human_review_notes=notes.value;markDirty();}; root.append(notes);
      const complete=node("label","","complete"); const checkbox=document.createElement("input"); checkbox.type="checkbox"; checkbox.checked=Boolean(auditCase.human_review_complete); checkbox.onchange=()=>{auditCase.human_review_complete=checkbox.checked;markDirty();render();}; complete.append(checkbox,node("span","已逐项核对 boundary、anchor 与 false boundary")); root.append(complete);
    };
    const download = () => {
      bundle.cases=bundle.items.map((item)=>cases.get(item.paper_id)); const blob=new Blob([JSON.stringify(bundle,null,2)+"\n"],{type:"application/json"}); const link=document.createElement("a"); link.href=URL.createObjectURL(blob); link.download=`p34_paper_index_${bundle.annotator_role}_${bundle.bundle_sha256.slice(0,12)}_labeled.json`; document.body.append(link); link.click(); link.remove(); URL.revokeObjectURL(link.href); app.dirty=false; $("state").textContent="已导出";
    };
    $("identity").textContent=`paper_index · ${bundle.annotator_role} · ${bundle.reviewer_id}`;
    $("search").oninput=()=>applyFilters(); $("openOnly").onchange=()=>applyFilters(); $("previous").onclick=()=>{app.index=Math.max(0,app.index-1);render();}; $("next").onclick=()=>{app.index=Math.min(Math.max(0,app.visible.length-1),app.index+1);render();}; $("download").onclick=download;
    window.addEventListener("beforeunload",(event)=>{if(app.dirty){event.preventDefault();event.returnValue="";}}); applyFilters();
  </script>
</body>
</html>
